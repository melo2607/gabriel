<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>gabriel legal</title>
    <style>
        /* Reset para evitar estouro de tela (overflow) */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Variáveis de cores para o Dark/Light Mode */
        :root {
            --bg-color: #121212;
            --container-bg: rgba(20, 20, 20, 0.85);
            --terminal-bg: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #00ff66; /* Verde terminal */
            --border-color: #333333;
        }

        body.light-mode {
            --bg-color: #f4f4f9;
            --container-bg: rgba(255, 255, 255, 0.9);
            --terminal-bg: #1e1e1e;
            --text-color: #1a1a1a;
            --accent-color: #0088cc;
            --border-color: #cccccc;
        }

        body {
            background-image: url('meufundo.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Botão para mudar Tema */
        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        /* Cartão Centralizado */
        .main-card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .main-card h1 {
            font-size: 2rem;
            margin-top: 0;
        }

        .main-card h2 {
            font-size: 1.25rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Bloco das Redes Sociais */
        .bloco-redes {
            display: flex;
            gap: 20px;       
            justify-content: center;
            align-items: center; 
            margin: 25px 0;
            flex-wrap: wrap; /* Permite quebrar linha em telas extremamente estreitas */
        }

        .bloco-redes a i, .bloco-redes a img {
            font-size: 40px;     
            width: 40px;
            height: 40px;
            transition: 0.3s;     
        }

        .bloco-redes a:hover i, .bloco-redes a:hover img {
            transform: scale(1.2); 
        }

        .link-instagram i { color: #E1306C; }
        .link-instagram i:hover { color: #B12352; }

        .link-tiktok i { color: #00f2fe; }
        .link-tiktok i:hover { color: #fe0979; }

        .link-linkedin i { color: #0077B5; }
        .link-linkedin i:hover { color: #005582; }

        .link-github i { color: var(--text-color); }
        .link-github i:hover { color: #adb5bd; }

        .link-letterboxd img {
            filter: invert(53%) sepia(93%) saturate(1754%) hue-rotate(113deg) brightness(97%) contrast(105%);
        }
        .link-letterboxd:hover img {
            filter: invert(55%) sepia(81%) saturate(2971%) hue-rotate(12deg) brightness(101%) contrast(101%);
        }

        /* Estilo do Terminal Interativo */
        .terminal {
            background-color: var(--terminal-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin-top: 25px;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            width: 100%;
        }

        .terminal-header {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .terminal-body {
            height: 160px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.4;
        }

        .terminal-output p {
            margin: 4px 0;
            word-break: break-word; /* Evita que o texto quebre a largura do terminal no mobile */
        }

        .prompt-line {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        .prompt-symbol {
            color: var(--accent-color);
            margin-right: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .terminal-input:disabled {
            opacity: 0.5;
        }

        .thinking-dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* Card "tocando agora" do Spotify */
        .spotify-card {
            margin-top: 25px;
            border-radius: 12px;
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            text-decoration: none;
            color: inherit;
            transition: 0.2s;
        }

        .spotify-card:hover {
            border-color: var(--accent-color);
        }

        .spotify-card .album-art {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: #222;
        }

        .spotify-card .spotify-info {
            min-width: 0; /* permite o text-overflow funcionar dentro do flex */
            flex: 1;
        }

        .spotify-card .spotify-status {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .spotify-card .spotify-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-card .spotify-artist {
            font-size: 13px;
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-card i.fa-spotify {
            color: #1DB954;
            font-size: 20px;
            flex-shrink: 0;
        }

        /* Barrinhas animadas quando está tocando agora */
        .now-playing-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
        }
        .now-playing-bars span {
            width: 2px;
            background: var(--accent-color);
            animation: bounce 1s ease-in-out infinite;
        }
        .now-playing-bars span:nth-child(1) { animation-delay: 0s; }
        .now-playing-bars span:nth-child(2) { animation-delay: 0.2s; }
        .now-playing-bars span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { height: 3px; }
            50% { height: 10px; }
        }

        /* ==================== REGRAS DE RESPONSIVIDADE ==================== */

        /* Dispositivos Móveis (smartphones até 600px) */
        @media (max-width: 600px) {
            body {
                padding: 60px 12px 20px 12px; /* Aumentado padding superior para dar espaço ao botão */
            }

            .theme-toggle-btn {
                top: 12px;
                right: 12px;
                padding: 8px 12px;
                font-size: 14px;
            }

            .main-card {
                padding: 20px 15px;
            }

            .main-card h1 {
                font-size: 1.5rem;
            }

            .main-card h2 {
                font-size: 1rem;
            }

            .bloco-redes {
                gap: 15px;
                margin: 20px 0;
            }

            .bloco-redes a i, .bloco-redes a img {
                font-size: 32px;
                width: 32px;
                height: 32px;
            }

            .terminal {
                padding: 10px;
                margin-top: 20px;
            }

            .terminal-body {
                height: 140px;
                font-size: 13px;
            }

            .terminal-input {
                font-size: 13px;
            }
        }

        /* Telas muito pequenas (smartphones pequenos até 380px) */
        @media (max-width: 380px) {
            .bloco-redes {
                gap: 12px;
            }

            .bloco-redes a i, .bloco-redes a img {
                font-size: 28px;
                width: 28px;
                height: 28px;
            }

            .prompt-symbol {
                font-size: 12px;
            }

            .terminal-input {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Botão de Alternar Tema (Dark/Light) -->
    <button class="theme-toggle-btn" id="themeBtn" title="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="main-card">
        <h1>Olá, meu nome é Gabriel</h1>
        <h2>Estou aprendendo sobre programação</h2>
        
        <!-- Redes Sociais -->
        <div class="bloco-redes">
            <a href="https://www.instagram.com/g_sbriel/" target="_blank" class="link-instagram" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            
            <a href="https://www.linkedin.com/in/gabriel-melo-silva-404a21385?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="link-linkedin" title="LinkedIn">
                <i class="fa-brands fa-linkedin"></i>
            </a>

            <a href="https://www.tiktok.com/@.gsbriel?_r=1&_t=ZS-97GtM3Hgq7m" target="_blank" class="link-tiktok" title="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>

            <a href="https://github.com/melo2607" target="_blank" class="link-github" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>

            <a href="https://boxd.it/fHchF" target="_blank" class="link-letterboxd" title="Letterboxd">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/letterboxd.svg" alt="Letterboxd">
            </a>
        </div>

        <!-- Terminal Interativo -->
        <div class="terminal">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="terminal-output" id="terminalOutput">
                    <p style="color: var(--accent-color);">Digite qualquer comando. Ex: 'help', 'about', 'me conte uma piada', 'explique recursão'...</p>
                </div>
                <div class="prompt-line">
                    <span class="prompt-symbol">gabriel@dev:~$</span>
                    <input type="text" id="terminalInput" class="terminal-input" autofocus autocomplete="off">
                </div>
            </div>
        </div>

        <!-- Card "tocando agora" do Spotify -->
        <a href="https://open.spotify.com" target="_blank" id="spotifyCard" class="spotify-card" style="display:none;">
            <img id="spotifyArt" class="album-art" src="" alt="Capa do álbum">
            <div class="spotify-info">
                <div class="spotify-status" id="spotifyStatus"></div>
                <div class="spotify-title" id="spotifyTitle"></div>
                <div class="spotify-artist" id="spotifyArtist"></div>
            </div>
            <i class="fa-brands fa-spotify"></i>
        </a>
    </div>

    <script>
        // --- 1. Lógica do Dark / Light Mode ---
        const themeBtn = document.getElementById('themeBtn');
        const icon = themeBtn.querySelector('i');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        });

        // --- 2. Lógica do Terminal Interativo (agora via backend próprio) ---
        const terminalInput = document.getElementById('terminalInput');
        const terminalOutput = document.getElementById('terminalOutput');
        const terminalBody = document.getElementById('terminalBody');

        // Histórico de conversa enviado à IA (mantém contexto do terminal)
        let conversationHistory = [];

        // Comandos "de sistema" que continuam instantâneos e não passam pela IA
        const systemCommands = {
            'clear': 'CLEAR',
            'help': `Comandos rápidos: <b style="color: var(--accent-color);">about</b>, <b style="color: var(--accent-color);">skills</b>, <b style="color: var(--accent-color);">projects</b>, <b style="color: var(--accent-color);">movies</b>, <b style="color: var(--accent-color);">clear</b>.<br>Além disso, digite qualquer pergunta, pedido ou comando em texto livre — o terminal vai interpretar e responder.`
        };

        function appendLine(html, color) {
            const p = document.createElement('p');
            if (color) p.style.color = color;
            p.innerHTML = html;
            terminalOutput.appendChild(p);
            terminalBody.scrollTop = terminalBody.scrollHeight;
            return p;
        }

        async function askAI(userInput) {
            const thinkingLine = appendLine('<span class="thinking-dots">processando</span>', 'var(--accent-color)');

            conversationHistory.push({ role: 'user', content: userInput });

            try {
                // Chama nosso próprio backend (/api/chat), NÃO a Anthropic direto.
                // A chave da API fica só no servidor, nunca no navegador.
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido');
                }

                const replyText = data.reply || 'Erro: sem resposta do sistema.';

                conversationHistory.push({ role: 'assistant', content: replyText });
                // Mantém o histórico enxuto (últimas 12 mensagens) para não pesar as requisições
                if (conversationHistory.length > 12) {
                    conversationHistory = conversationHistory.slice(-12);
                }

                thinkingLine.innerHTML = replyText;
                thinkingLine.style.color = '';
            } catch (err) {
                console.error(err);
                thinkingLine.textContent = 'Erro: falha de conexão com o terminal.';
                thinkingLine.style.color = '#ff5f56';
            }

            terminalBody.scrollTop = terminalBody.scrollHeight;
            terminalInput.disabled = false;
            terminalInput.focus();
        }

        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !terminalInput.disabled) {
                const rawVal = terminalInput.value.trim();
                const inputVal = rawVal.toLowerCase();

                if (rawVal !== '') {
                    appendLine(`<span style="color: var(--accent-color);">gabriel@dev:~$</span> ${rawVal}`);
                    terminalInput.value = '';

                    if (inputVal === 'clear') {
                        terminalOutput.innerHTML = '';
                        conversationHistory = [];
                    } else if (systemCommands[inputVal]) {
                        appendLine(systemCommands[inputVal]);
                    } else {
                        terminalInput.disabled = true;
                        askAI(rawVal);
                        return; // askAI reabilita o input ao terminar
                    }

                    terminalBody.scrollTop = terminalBody.scrollHeight;
                }
            }
        });

        // --- 3. Card "tocando agora" do Spotify (via /api/spotify) ---
        const spotifyCard = document.getElementById('spotifyCard');
        const spotifyArt = document.getElementById('spotifyArt');
        const spotifyStatus = document.getElementById('spotifyStatus');
        const spotifyTitle = document.getElementById('spotifyTitle');
        const spotifyArtist = document.getElementById('spotifyArtist');

        // Dados via Last.fm (o Spotify precisa estar conectado/scrobblando pra sua conta Last.fm)
        const LASTFM_USERNAME = 'gabiruds';
        const LASTFM_API_KEY = 'f26593c7fefe7a0282f3109e9e1b1f19';

        async function atualizarSpotify() {
            try {
                const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`;
                const response = await fetch(url);
                const data = await response.json();

                const track = data.recenttracks?.track?.[0];

                if (!track) {
                    spotifyCard.style.display = 'none';
                    return;
                }

                const isNowPlaying = track['@attr']?.nowplaying === 'true';
                const images = track.image || [];
                const albumArt = images[images.length - 1]?.['#text'] || '';

                spotifyArt.src = albumArt;
                spotifyTitle.textContent = track.name;
                spotifyArtist.textContent = track.artist?.['#text'] || '';
                spotifyCard.href = track.url || 'https://www.last.fm/user/' + LASTFM_USERNAME;

                if (isNowPlaying) {
                    spotifyStatus.innerHTML = '<span class="now-playing-bars"><span></span><span></span><span></span></span> Tocando agora';
                } else {
                    spotifyStatus.textContent = 'Última música ouvida';
                }

                spotifyCard.style.display = 'flex';
            } catch (err) {
                console.error('Erro ao buscar Last.fm:', err);
                spotifyCard.style.display = 'none';
            }
        }

        atualizarSpotify();
        setInterval(atualizarSpotify, 30000); // atualiza a cada 30 segundos
    </script>
</body>
</html>
